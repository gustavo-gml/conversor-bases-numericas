
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conversor Decimal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <h1 class="h3 text-center mb-3">
                            Conversor Decimal
                        </h1>

                        <p class="text-secondary text-center">
                            Converta números decimais para binário.
                        </p>

                        <form action="/decimal" method="POST">
                            <div class="mb-3">
                                <label for="numero" class="form-label">
                                    Número decimal
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="numero"
                                    name="numero"
                                    value="{{ numero }}"
                                    placeholder="Ex.: 13"
                                    pattern="[0-9]+"
                                    title="Digite somente números inteiros não negativos."
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Converter
                            </button>
                        </form>

                        {% if erro %}
                            <div class="alert alert-danger mt-3 mb-0">
                                {{ erro }}
                            </div>
                        {% endif %}

                        <div class="text-center mt-3">
                            <a href="/" class="text-decoration-none">
                                Voltar ao início
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Modal com o resultado -->
    <div
        class="modal fade"
        id="modalResultados"
        tabindex="-1"
        aria-labelledby="tituloModal"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="tituloModal">
                        Resultado da conversão
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar"
                    ></button>
                </div>

                <div class="modal-body">
                    {% if resultado is not none %}
                        <p class="text-secondary mb-1">
                            Número decimal informado
                        </p>

                        <div class="fs-4 fw-bold mb-4">
                            {{ numero }}
                        </div>

                        <div>
                            <label class="form-label">Binário</label>
                            <div class="form-control bg-light">
                                {{ resultado }}
                            </div>
                        </div>
                    {% endif %}
                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Fechar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% if resultado is not none %}
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const elemento = document.getElementById("modalResultados");
                const modal = new bootstrap.Modal(elemento);
                modal.show();
            });
        </script>
    {% endif %}

</body>
</html>
